name: Kraken Sim V2 — vérification sans ordres (en attente GrokBot)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/sim_v2.yml'
  push:
    branches: [main]
    paths:
      - 'v2/paper_executor.py'
      - 'v2/test_paper_executor.py'
      - 'v2/engine.py'
      - '.github/workflows/sim_v2.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler que V2 n'invente pas de capital
        run: |
          python -m py_compile v2/engine.py v2/paper_executor.py v2/plan_contract.py v2/test_paper_executor.py v2/test_plan_contract.py v2/test_engine_preflight.py
          python -m unittest discover -s v2 -p 'test_*.py' -v
          python v2/engine.py
          python - <<'PY'
          import json
          d=json.load(open("v2/state.json"))
          assert d.get("initial") is None
          assert d.get("cash") is None
          assert d.get("equity") is None
          assert d.get("pnl_pct") is None
          assert not d.get("orders")
          print("V2 en attente des donnees validees GrokBot")
          PY
