name: Kraken Sim V2 — rapport GPT-6 (validation only)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'v2/reports/**'
      - 'v2/check_report.py'
      - '.github/workflows/v2_report.yml'
permissions:
  contents: read
jobs:
  validate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check report template
        run: python v2/check_report.py v2/reports/TEMPLATE.md --template
      - name: Validate any dated report
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "v2")
          from check_report import validate_report
          for p in Path("v2/reports").glob("????-??-??.md"):
              content=p.read_text(encoding="utf-8")
              if "Statut : rapport pilote" in content:
                  print("Pilot report pending verified Kraken data:",p)
                  continue
              validate_report(content)
              print("Validated", p)
          PY
# No schedule: report generation requires live sources and a separate authorized
# GPT-6 task before 18:30 Europe/Paris. This workflow never invents data.

# This workflow does not collect Kraken data. Live data collection must run
# in a separately authorized network-enabled job and be reviewed via PR.
