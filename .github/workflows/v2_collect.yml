name: Kraken Sim V2 — collecte quotidienne des données Kraken (publiques)
on:
  schedule:
    - cron: '0 16 * * *'   # ~17h Paris (hiver), avant le rapport GPT-6 de 18h30
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v2-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecte API publique Kraken (aucune clé)
        run: |
          D=$(date -u +%F)
          mkdir -p /tmp/out
          python v2/collect_market_report.py --date "$D" --out-dir /tmp/out
          echo "D=$D" >> "$GITHUB_ENV"
      - name: Publier sur la branche data-v2 (jamais sur main)
        run: |
          git config user.name "kraken-sim-collector"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin data-v2 || true
          if git rev-parse --verify origin/data-v2 >/dev/null 2>&1; then git checkout -B data-v2 origin/data-v2; else git checkout --orphan data-v2 && git rm -rqf .; fi
          mkdir -p reports && cp /tmp/out/* reports/
          git add reports && git commit -qm "data: collecte Kraken $D" || exit 0
          git push origin data-v2
