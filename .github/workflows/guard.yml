name: garde-fous (contrat dashboard + périmètre UX)
on:
  pull_request:
  push:
    branches: [main, develop]
    paths-ignore: [sim.db, "state/**", dashboard.html, index.html, page_contents.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preprod-isole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: preprod.yml / render_preprod.py n'écrivent jamais dans la prod
        run: |
          F=".github/workflows/preprod.yml render_preprod.py"
          for f in $F; do [ -f "$f" ] || continue
            if grep -nE 'sim\.db|cycle[_a-z0-9]*\.py|render_page\.py|page_data\.py|contents: *write' "$f"; then echo "::error::$f référence les données/le moteur de prod ou demande l'écriture"; exit 1; fi
            if grep -nE 'cyrillaferrere/kraken-sim(\.git)?([^-]|$)' "$f" | grep -vE 'raw\.githubusercontent\.com/cyrillaferrere/kraken-sim/main/state/public_state\.json'; then echo "::error::$f vise le dépôt de prod kraken-sim (seul le state public en lecture est permis)"; exit 1; fi
          done
          grep -nE "open\([^)]*state/|state/[^\"]*\", *[\"']w" render_preprod.py && { echo "::error::écriture dans state/"; exit 1; } || true
          if grep 'git push' .github/workflows/preprod.yml | grep -v 'git@github.com:cyrillaferrere/kraken-sim-preprod.git'; then echo "::error::push hors kraken-sim-preprod"; exit 1; fi
          echo "préprod isolée"
  sim-v12-isole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "sim_v12.yml isolé (seul schedule autorisé = cron 25 * * * *)"
        shell: bash
        run: |
          F=.github/workflows/sim_v12.yml
          test -f "$F" || exit 0
          # Assouplissement minimal : un unique schedule, exactement cron '25 * * * *'.
          N=$(grep -cE '^[[:space:]]*schedule:' "$F" || true)
          if [ "$N" != "0" ]; then
            [ "$N" = "1" ] || { echo "::error::plusieurs schedule"; exit 1; }
            [ "$(grep -cE '^[[:space:]]*- cron:' "$F")" = "1" ] || { echo "::error::un seul cron autorisé"; exit 1; }
            grep -qE "^    - cron: '25 \* \* \* \*'$" "$F" || { echo "::error::seul cron '25 * * * *' autorisé"; exit 1; }
          fi
          ! grep -nE '^[[:space:]]*contents: write|git push .*kraken-sim\.git|git push (--force|-f )' "$F" || { echo "::error::écriture prod ou force-push"; exit 1; }
          grep -q 'cancel-in-progress: false' "$F" || { echo "::error::concurrency manquante"; exit 1; }
          grep -q 'group: kraken-sim-v12' "$F" || { echo "::error::concurrency group manquant"; exit 1; }
          grep -q 'V12_REVIEWED_CODE_SHA' "$F" || exit 1
          grep -q 'V12_MIN_INTERVAL_MIN' "$F" || { echo "::error::anti-doublon manquant"; exit 1; }
          # Contrôles PAPER : 0 ordre réel, aucune clé, investi <= plafond.
          grep -q "live_orders'\]==0" "$F" && grep -q "api_keys_used'\] is False" "$F" && grep -q "invested_usdc'\]<=" "$F" || { echo "::error::contrôles PAPER absents"; exit 1; }
          # Aucun secret autre que la clé de déploiement préprod ; aucune clé Kraken.
          BAD=$(grep -oE 'secrets\.[A-Za-z0-9_]+' "$F" | sort -u | grep -v '^secrets\.PREPROD_DEPLOY_KEY$' || true)
          [ -z "$BAD" ] || { echo "::error::secret non autorisé : $BAD"; exit 1; }
          ! grep -niE 'KRAKEN_(API|KEY|SECRET|PRIVATE)|api\.kraken\.com/0/private' "$F" || { echo "::error::clé ou API privée Kraken"; exit 1; }
          echo "sim_v12 isolé"
  perimetre-ux:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Une PR ux/* ne touche que l'affichage
        run: |
          ALLOWED='^(dashboard_template\.html|CHANGELOG\.md|docs/SPEC_UX\.md)$'
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Fichiers modifiés :"; echo "$FILES"
          BAD=$(echo "$FILES" | grep -Ev "$ALLOWED" || true)
          if [ -n "$BAD" ]; then echo "::error::Hors périmètre UX (voir GARDE_FOUS.md) : $BAD"; exit 1; fi
          echo "Périmètre respecté"
  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Version UX / moteur incrémentée + CHANGELOG
        run: |
          B=origin/${{ github.base_ref }}
          FILES=$(git diff --name-only $B...HEAD)
          ux() { grep -oP '^const VERSION_UX = "\K[^"]+' "$1"; }
          if echo "$FILES" | grep -q '^dashboard_template\.html$'; then
            OLD=$(git show $B:dashboard_template.html | grep -oP '^const VERSION_UX = "\K[^"]+'); NEW=$(ux dashboard_template.html)
            [ "$OLD" != "$NEW" ] || { echo "::error::dashboard_template.html modifié sans incrémenter VERSION_UX ($OLD)"; exit 1; }
            echo "$FILES" | grep -q '^CHANGELOG\.md$' || { echo "::error::modif UX sans entrée CHANGELOG.md"; exit 1; }
            git diff $B...HEAD -- CHANGELOG.md | grep -q "^+## \[UX $NEW\]" || { echo "::error::CHANGELOG.md : ajouter une entrée '## [UX $NEW] — …'"; exit 1; }
            echo "UX $OLD -> $NEW OK"
          fi
          if echo "$FILES" | grep -q '^strategy/'; then
            OLD=$(git show $B:strategy/params.json | grep -oP '"STRATEGY_VERSION": *"\K[^"]+'); NEW=$(grep -oP '"STRATEGY_VERSION": *"\K[^"]+' strategy/params.json)
            [ "$OLD" != "$NEW" ] || { echo "::error::stratégie modifiée sans incrémenter STRATEGY_VERSION ($OLD)"; exit 1; }
            E=$(git diff $B...HEAD -- CHANGELOG.md | grep '^+')
            echo "$E" | grep -q "^+## \[Stratégie $NEW\]" || { echo "::error::CHANGELOG.md : ajouter '## [Stratégie $NEW] — …'"; exit 1; }
            echo "$E" | grep -qi 'backtest' || { echo "::error::entrée Stratégie sans résultat de backtest"; exit 1; }
            echo "Stratégie $OLD -> $NEW OK"
          fi
          if echo "$FILES" | grep -Eq '^(cycle_v11\.py|cycle\.py|backtest\.py|page_data\.py|render_page\.py)$'; then
            OLD=$(git show $B:VERSION_ENGINE); NEW=$(cat VERSION_ENGINE)
            [ "$OLD" != "$NEW" ] || { echo "::error::moteur/données modifiés sans incrémenter VERSION_ENGINE ($OLD)"; exit 1; }
            git diff $B...HEAD -- CHANGELOG.md | grep -q "^+## \[Moteur $NEW\]" || { echo "::error::CHANGELOG.md : ajouter une entrée '## [Moteur $NEW] — …'"; exit 1; }
            echo "Moteur $OLD -> $NEW OK"
          fi
  contrat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Contrat d'interface du dashboard (rendu réel + Chrome headless)
        run: python3 tests/check_template.py
