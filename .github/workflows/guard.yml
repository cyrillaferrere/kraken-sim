name: garde-fous (contrat dashboard + périmètre UX)
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [sim.db, "state/**", dashboard.html, index.html, page_contents.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perimetre-ux:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Une PR ux/* ne touche que l'affichage
        run: |
          ALLOWED='^(dashboard_template\.html|CHANGELOG\.md|docs/SPEC_UX\.md)$'
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Fichiers modifiés :"; echo "$FILES"
          BAD=$(echo "$FILES" | grep -Ev "$ALLOWED" || true)
          if [ -n "$BAD" ]; then echo "::error::Hors périmètre UX (voir GARDE_FOUS.md) : $BAD"; exit 1; fi
          echo "Périmètre respecté"
  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Version UX / moteur incrémentée + CHANGELOG
        run: |
          B=origin/${{ github.base_ref }}
          FILES=$(git diff --name-only $B...HEAD)
          ux() { grep -oP '^const VERSION_UX = "\K[^"]+' "$1"; }
          if echo "$FILES" | grep -q '^dashboard_template\.html$'; then
            OLD=$(git show $B:dashboard_template.html | grep -oP '^const VERSION_UX = "\K[^"]+'); NEW=$(ux dashboard_template.html)
            [ "$OLD" != "$NEW" ] || { echo "::error::dashboard_template.html modifié sans incrémenter VERSION_UX ($OLD)"; exit 1; }
            echo "$FILES" | grep -q '^CHANGELOG\.md$' || { echo "::error::modif UX sans entrée CHANGELOG.md"; exit 1; }
            git diff $B...HEAD -- CHANGELOG.md | grep -q "^+## \[UX $NEW\]" || { echo "::error::CHANGELOG.md : ajouter une entrée '## [UX $NEW] — …'"; exit 1; }
            echo "UX $OLD -> $NEW OK"
          fi
          if echo "$FILES" | grep -q '^strategy/'; then
            OLD=$(git show $B:strategy/params.json | grep -oP '"STRATEGY_VERSION": *"\K[^"]+'); NEW=$(grep -oP '"STRATEGY_VERSION": *"\K[^"]+' strategy/params.json)
            [ "$OLD" != "$NEW" ] || { echo "::error::stratégie modifiée sans incrémenter STRATEGY_VERSION ($OLD)"; exit 1; }
            E=$(git diff $B...HEAD -- CHANGELOG.md | grep '^+')
            echo "$E" | grep -q "^+## \[Stratégie $NEW\]" || { echo "::error::CHANGELOG.md : ajouter '## [Stratégie $NEW] — …'"; exit 1; }
            echo "$E" | grep -qi 'backtest' || { echo "::error::entrée Stratégie sans résultat de backtest"; exit 1; }
            echo "Stratégie $OLD -> $NEW OK"
          fi
          if echo "$FILES" | grep -Eq '^(cycle_v11\.py|cycle\.py|backtest\.py|page_data\.py|render_page\.py)$'; then
            OLD=$(git show $B:VERSION_ENGINE); NEW=$(cat VERSION_ENGINE)
            [ "$OLD" != "$NEW" ] || { echo "::error::moteur/données modifiés sans incrémenter VERSION_ENGINE ($OLD)"; exit 1; }
            git diff $B...HEAD -- CHANGELOG.md | grep -q "^+## \[Moteur $NEW\]" || { echo "::error::CHANGELOG.md : ajouter une entrée '## [Moteur $NEW] — …'"; exit 1; }
            echo "Moteur $OLD -> $NEW OK"
          fi
  contrat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Contrat d'interface du dashboard (rendu réel + Chrome headless)
        run: python3 tests/check_template.py
