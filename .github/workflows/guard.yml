name: garde-fous (contrat dashboard + périmètre UX)
on:
  pull_request:
  push:
    branches: [main, develop]
    paths-ignore: [sim.db, "state/**", dashboard.html, index.html, page_contents.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preprod-isole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: preprod.yml / render_preprod.py n'écrivent jamais dans la prod
        run: |
          F=".github/workflows/preprod.yml render_preprod.py"
          for f in $F; do [ -f "$f" ] || continue
            if grep -nE 'sim\.db|cycle[_a-z0-9]*\.py|render_page\.py|page_data\.py|contents: *write' "$f"; then echo "::error::$f référence les données/le moteur de prod ou demande l'écriture"; exit 1; fi
            if grep -nE 'cyrillaferrere/kraken-sim(\.git)?([^-]|$)' "$f" | grep -vE 'raw\.githubusercontent\.com/cyrillaferrere/kraken-sim/main/state/public_state\.json'; then echo "::error::$f vise le dépôt de prod kraken-sim (seul le state public en lecture est permis)"; exit 1; fi
          done
          grep -nE "open\([^)]*state/|state/[^\"]*\", *[\"']w" render_preprod.py && { echo "::error::écriture dans state/"; exit 1; } || true
          if grep 'git push' .github/workflows/preprod.yml | grep -v 'git@github.com:cyrillaferrere/kraken-sim-preprod.git'; then echo "::error::push hors kraken-sim-preprod"; exit 1; fi
          echo "préprod isolée"
  perimetre-ux:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Une PR ux/* ne touche que l'affichage
        run: |
          ALLOWED='^(dashboard_template\.html|CHANGELOG\.md|docs/SPEC_UX\.md)$'
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Fichiers modifiés :"; echo "$FILES"
          BAD=$(echo "$FILES" | grep -Ev "$ALLOWED" || true)
          if [ -n "$BAD" ]; then echo "::error::Hors périmètre UX (voir GARDE_FOUS.md) : $BAD"; exit 1; fi
          echo "Périmètre respecté"
  perimetre-gpt6:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'strategy/v1.2') && (startsWith(github.head_ref, 'ux/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: ux/feature/fix ne touchent ni moteur, ni stratégie, ni sim.yml, ni état
        run: |
          FORBIDDEN='^(cycle[_a-z0-9]*\.py|backtest[_a-z0-9]*\.py|page_data\.py|render_page\.py|run_cycle[_a-z0-9]*\.sh|VERSION_ENGINE|params\.json|strategy/.*|\.github/workflows/sim\.yml|state/.*|sim\.db)$'
          BAD=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E "$FORBIDDEN" || true)
          if [ -n "$BAD" ]; then echo "::error::Chemins réservés (revue technique Kraken Bot, voir GARDE_FOUS.md) : $BAD"; exit 1; fi
          echo "Aucun chemin moteur/stratégie/état modifié"
  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Version UX / moteur incrémentée + CHANGELOG
        run: |
          B=origin/${{ github.base_ref }}
          FILES=$(git diff --name-only $B...HEAD)
          ux() { grep -oP '^const VERSION_UX = "\K[^"]+' "$1"; }
          if echo "$FILES" | grep -q '^dashboard_template\.html$'; then
            OLD=$(git show $B:dashboard_template.html | grep -oP '^const VERSION_UX = "\K[^"]+'); NEW=$(ux dashboard_template.html)
            [ "$OLD" != "$NEW" ] || { echo "::error::dashboard_template.html modifié sans incrémenter VERSION_UX ($OLD)"; exit 1; }
            echo "$FILES" | grep -q '^CHANGELOG\.md$' || { echo "::error::modif UX sans entrée CHANGELOG.md"; exit 1; }
            git diff $B...HEAD -- CHANGELOG.md | grep -q "^+## \[UX $NEW\]" || { echo "::error::CHANGELOG.md : ajouter une entrée '## [UX $NEW] — …'"; exit 1; }
            echo "UX $OLD -> $NEW OK"
          fi
          if echo "$FILES" | grep -q '^strategy/params\.json$'; then
            OLD=$(git show $B:strategy/params.json | grep -oP '"STRATEGY_VERSION": *"\K[^"]+'); NEW=$(grep -oP '"STRATEGY_VERSION": *"\K[^"]+' strategy/params.json)
            [ "$OLD" != "$NEW" ] || { echo "::error::stratégie modifiée sans incrémenter STRATEGY_VERSION ($OLD)"; exit 1; }
            E=$(git diff $B...HEAD -- CHANGELOG.md | grep '^+')
            echo "$E" | grep -q "^+## \[Stratégie $NEW\]" || { echo "::error::CHANGELOG.md : ajouter '## [Stratégie $NEW] — …'"; exit 1; }
            echo "$E" | grep -qi 'backtest' || { echo "::error::entrée Stratégie sans résultat de backtest"; exit 1; }
            echo "Stratégie $OLD -> $NEW OK"
          fi
          if echo "$FILES" | grep -q '^strategy/v1_2/'; then
            NEW=$(grep -oP '"STRATEGY_VERSION": *"\K[^"]+' strategy/v1_2/params.json)
            test "$NEW" = "V1.2" || { echo "::error::version de strategie incorrecte"; exit 1; }
            git diff "$B"...HEAD -- CHANGELOG.md | grep -q "^+## \[Stratégie $NEW\]" || { echo "::error::journal strategie V1.2 manquant"; exit 1; }
            git diff "$B"...HEAD -- CHANGELOG.md | grep -qi "backtest" || { echo "::error::statut backtest absent du journal"; exit 1; }
          fi
          if echo "$FILES" | grep -Eq '^(cycle_v11\.py|cycle\.py|backtest\.py|page_data\.py|render_page\.py)$'; then
            OLD=$(git show $B:VERSION_ENGINE); NEW=$(cat VERSION_ENGINE)
            [ "$OLD" != "$NEW" ] || { echo "::error::V1.1 engine code changed without VERSION_ENGINE increment"; exit 1; }
            git diff $B...HEAD -- CHANGELOG.md | grep -q "^+## \[Moteur $NEW\]" || { echo "::error::Missing V1.1 engine changelog"; exit 1; }
          fi
          if echo "$FILES" | grep -Eq '^(cycle_v12\.py|export_v12\.py|backtest_v12\.py|v12_[a-z0-9_]+\.py)$'; then
            OLD_SHARED=$(git show $B:VERSION_ENGINE)
            NEW_SHARED=$(cat VERSION_ENGINE)
            [ "$OLD_SHARED" = "$NEW_SHARED" ] || { echo "::error::V1.2 must never alter V1.1 VERSION_ENGINE"; exit 1; }
            OLD_V12=$(git show $B:VERSION_ENGINE_V12 2>/dev/null || true)
            NEW_V12=$(cat VERSION_ENGINE_V12)
            [ -n "$NEW_V12" ] && [ "$OLD_V12" != "$NEW_V12" ] || { echo "::error::V1.2 engine changes require independent VERSION_ENGINE_V12 increment"; exit 1; }
            git diff $B...HEAD -- CHANGELOG.md | grep -q "^+## \[Moteur $NEW_V12\]" || { echo "::error::Missing V1.2 engine changelog"; exit 1; }
            echo "Moteur expérimental $OLD_V12 -> $NEW_V12 ; moteur partagé inchangé"
          fi
  contrat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Contrat d'interface du dashboard (rendu réel + Chrome headless)
        run: python3 tests/check_template.py

  perimetre-strategie:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'strategy/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Aucun fichier de simulation V1.1 modifie
        shell: bash
        run: |
          FILES=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)
          BAD=$(echo "$FILES" | grep -E '^(sim\.db|cycle_v11\.py|cycle\.py|strategy/params\.json|\.github/workflows/sim\.yml|page_data\.py|render_page\.py|dashboard_template\.html)$|^state/' || true)
          test -z "$BAD" || { echo "::error::V1.1 interdite : $BAD"; exit 1; }
  isolation-v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Controle statique du workflow V1.2
        shell: bash
        run: |
          if test -f .github/workflows/sim_v12.yml; then
            ! grep -Eq '^[[:space:]]*schedule:|^[[:space:]]*contents: write|git push .*kraken-sim\.git' .github/workflows/sim_v12.yml || { echo "::error::sim_v12 non isole"; exit 1; }
            grep -q 'cancel-in-progress: false' .github/workflows/sim_v12.yml || exit 1
            grep -q 'V12_REVIEWED_CODE_SHA' .github/workflows/sim_v12.yml || exit 1
          fi
      - name: Tests V1.2
        run: python3 -m unittest discover -s tests -p 'test_v12_*.py' -v
      - name: V1.1 intacte
        run: python3 -m unittest discover -s tests -p 'test_v11_nonregression.py' -v
